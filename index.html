<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ВАШ ТЕГ ПОДТВЕРЖДЕНИЯ GOOGLE -->
<meta name="google-site-verification" content="Z1VLBBFIUEjdPqBiJjCjU7jAKg3mTisBS-MTKRKaKLw" />
<title>InetFREE</title>
<style>
  :root { --bg: #0b0f14; --card: #121a23; --accent: #3ddc84; --text: #e6edf3; --muted: #8b98a5; --danger: #ff5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 50% -10%, #16324a 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
  
  h1 { font-size: clamp(22px, 5vw, 38px); text-align: center; margin: 0 0 12px; background: linear-gradient(90deg, var(--accent), #6ee7ff); -webkit-background-clip: text; background-clip: text; color: transparent; animation: fadeInDown 0.8s ease; }
  h2 { font-size: clamp(18px, 4vw, 26px); text-align: center; color: var(--danger); margin: 0 0 32px; letter-spacing: 1px; animation: fadeInDown 0.8s ease 0.2s both; }
  
  .card { width: 100%; max-width: 760px; background: var(--card); border: 1px solid #1f2a37; border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: fadeInUp 0.8s ease 0.4s both; }
  
  button { width: 100%; padding: 16px 20px; font-size: 17px; font-weight: 700; color: #06120a; background: linear-gradient(135deg, var(--accent), #22b573); border: none; border-radius: 12px; cursor: pointer; transition: transform .08s ease, filter .2s ease, box-shadow .2s ease; }
  button:hover { filter: brightness(1.08); box-shadow: 0 0 15px rgba(61, 220, 132, 0.4); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: wait; }
  
  .status { margin-top: 18px; font-size: 15px; color: var(--muted); text-align: center; font-weight: bold; }
  .result { margin-top: 22px; padding: 16px; background: #0e151d; border: 1px dashed #2a3a4d; border-radius: 12px; font-size: 13px; display: none; animation: fadeInUp 0.5s ease both; }
  .server-name { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 8px; word-break: break-word; text-align: center; }
  .cfg { width: 100%; min-height: 90px; resize: vertical; padding: 12px; background: #0b1219; color: #e6edf3; border: 1px solid #2a3a4d; border-radius: 8px; font-family: monospace; font-size: 12px; word-break: break-all; transition: border-color 0.3s; }
  .cfg:focus { outline: none; border-color: var(--accent); }
  .copy-row { margin-top: 10px; display: flex; gap: 10px; }
  .copy-row button { width: 100%; padding: 12px; font-size: 14px; }

  /* --- МОДАЛЬНОЕ ОКНО НА ВЕСЬ ЭКРАН --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(11, 15, 20, 0.95);
    backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
  
  .modal-content {
    background: var(--card); border: 1px solid #1f2a37; border-radius: 18px;
    width: 100%; max-width: 600px; padding: 40px 24px; 
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    text-align: center; position: relative;
    animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .close-btn {
    position: absolute; top: 15px; right: 20px; background: none; border: none;
    color: var(--muted); font-size: 32px; cursor: pointer; width: auto; padding: 0;
    transition: color 0.2s, transform 0.2s;
  }
  .close-btn:hover { color: var(--text); transform: rotate(90deg); filter: none; box-shadow: none; }
  
  .modal-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
  
  /* Пункты выбора */
  .choice-item {
    padding: 20px; background: #0e151d; border: 1px solid #2a3a4d; border-radius: 12px;
    margin-bottom: 16px; cursor: pointer; font-size: 18px; font-weight: 700;
    display: flex; justify-content: center; align-items: center;
    transition: all 0.2s ease;
  }
  .choice-item:hover { background: #1a2530; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(61,220,132,0.15); }

  /* Экраны инструкций */
  #happ-instruction, #incy-instruction { display: none; animation: fadeIn 0.4s ease; }
  
  /* КАРТИНКИ */
  .instruction-logo { 
    width: 100%; 
    max-width: 280px;
    height: auto; 
    max-height: 380px;
    object-fit: contain;
    margin: 0 auto 24px auto; 
    display: block;
    border-radius: 12px;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
  }
  
  .instruction-text { font-size: 18px; color: var(--text); line-height: 1.5; text-align: center; }
  .instruction-text b { color: var(--accent); }

  /* --- АНИМАЦИИ --- */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes float { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>

<h1>InetFREE — Присоединяйся к цифровому сопротивлению!</h1>
<h2>Нет блокировкам!</h2>

<div class="card">
  <button id="gen">⚡ Генерация ссылки</button>
  <div class="status" id="status">Нажмите кнопку, чтобы получить ключ.</div>
  <div class="result" id="result"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">&times;</button>
    
    <!-- Экран выбора -->
    <div id="choice-screen">
      <div class="modal-title">Куда добавить?</div>
      <div class="choice-item" id="btnIncy">
        <span>1. incy</span>
      </div>
      <div class="choice-item" id="btnHapp">
        <span>2. happ</span>
      </div>
    </div>

    <!-- Экран инструкции HAPP -->
    <div id="happ-instruction">
      <img src="https://nodemaven.com/wp-content/uploads/2026/06/hp1.svg" alt="HAPP Logo" class="instruction-logo" />
      <div class="modal-title">КАК ДОБАВИТЬ</div>
      <div class="instruction-text">
        Нажмите на <b>плюсик</b> и выберите <b>«Из буфера обмена»</b>.
      </div>
    </div>

    <!-- Экран инструкции INCY -->
    <div id="incy-instruction">
      <img src="https://nodemaven.com/wp-content/uploads/2026/09/in6-513x1024.jpg" alt="INCY Logo" class="instruction-logo" />
      <div class="modal-title">КАК ДОБАВИТЬ</div>
      <div class="instruction-text">
        Нажмите на кнопку <b>«Вставить»</b>.
      </div>
    </div>

  </div>
</div>

<script>
const SUB_URL = "https://raw.githubusercontent.com/ivanminakow-code/Chester-Vpn/refs/heads/main/SUBSCRIBE%20(1)%20(1).txt";
const $ = (id) => document.getElementById(id);

// Модальное окно и экраны
const modal = $("modal");
const choiceScreen = $("choice-screen");
const happInstruction = $("happ-instruction");
const incyInstruction = $("incy-instruction");

$("closeModal").addEventListener("click", () => {
  modal.classList.remove("active");
  setTimeout(() => {
    choiceScreen.style.display = "block";
    happInstruction.style.display = "none";
    incyInstruction.style.display = "none";
  }, 300);
});

// Клик по incy
$("btnIncy").addEventListener("click", () => {
  choiceScreen.style.display = "none";
  happInstruction.style.display = "none";
  incyInstruction.style.display = "block";
});

// Клик по happ
$("btnHapp").addEventListener("click", () => {
  choiceScreen.style.display = "none";
  incyInstruction.style.display = "none";
  happInstruction.style.display = "block";
});

// --- Логика генерации ---
function parseServer(line) {
  const trimmed = line.trim();
  if (!trimmed || trimmed.startsWith("#")) return null;
  let name = trimmed.split("#")[1] || "";
  try { name = decodeURIComponent(name); } catch (_) {}

  let host = null, port = null;
  try {
    const m = trimmed.match(/^[a-z0-9]+:\/\/(?:[^@]+@)?([^:\/?#]+):(\d+)/i);
    if (m) { host = m[1]; port = m[2]; }
    else if (trimmed.startsWith("vmess://")) {
      const b64 = trimmed.replace("vmess://", "");
      const json = JSON.parse(decodeURIComponent(escape(atob(b64))));
      host = json.add; port = json.port;
    }
  } catch (_) {}
  return { raw: trimmed, name: name || host || "server", host, port };
}

async function checkPort(host, port) {
  if (!host || !port) return { status: "unknown", ms: null };
  const start = performance.now();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 4000);
  try {
    await fetch(`https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://api.hackertarget.com/nmap/?q=${host}`), { signal: ctrl.signal });
    clearTimeout(t);
    return { status: "ok", ms: Math.round(performance.now() - start) };
  } catch (e) {
    clearTimeout(t);
    return { status: "unknown", ms: null };
  }
}

$("gen").addEventListener("click", async () => {
  const btn = $("gen"), status = $("status"), result = $("result");
  btn.disabled = true; result.style.display = "none";
  status.textContent = "Подбираю сервер...";

  try {
    const resp = await fetch(SUB_URL, { cache: "no-store" });
    if (!resp.ok) throw new Error("Ошибка сети");
    const text = await resp.text();
    
    let servers = text.split(/\r?\n/).map(parseServer).filter(s => s && s.host && s.port);
    if (!servers.length) throw new Error("Серверы не найдены");

    const nlServers = servers.filter(s => s.raw.startsWith("ss://") || s.name.toLowerCase().includes("нидерланды"));
    const checkList = nlServers.length > 0 ? nlServers : servers;

    const results = await Promise.all(checkList.map(async (s) => {
      const r = await checkPort(s.host, s.port);
      return { s, ...r };
    }));

    const ok = results.filter(r => r.status === "ok").sort((a,b) => a.ms - b.ms);
    const chosen = ok[0] || results[0];

    status.textContent = "Сервер готов!";
    result.style.display = "block";
    
    result.innerHTML = `
      <div class="server-name">${escapeHtml(chosen.s.name)}</div>
      <textarea id="cfg" class="cfg" readonly>${escapeHtml(chosen.s.raw)}</textarea>
      <div class="copy-row">
        <button id="copyBtn">📋 Копировать</button>
      </div>
    `;

    $("copyBtn").addEventListener("click", async () => {
      const ta = $("cfg");
      try { await navigator.clipboard.writeText(ta.value); } 
      catch { ta.select(); document.execCommand("copy"); }
      
      $("copyBtn").textContent = "✅ Скопировано";
      setTimeout(() => ($("copyBtn").textContent = "📋 Копировать"), 1500);
      
      // Открываем модалку на экран выбора
      choiceScreen.style.display = "block";
      happInstruction.style.display = "none";
      incyInstruction.style.display = "none";
      modal.classList.add("active");
    });
  } catch (e) {
    status.textContent = "Ошибка. Попробуйте еще раз.";
  } finally {
    btn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
